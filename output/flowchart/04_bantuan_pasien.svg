<text x="58" y="681" font-size="10" fill="#203F35" font-weight="700" text-anchor="start">Transkrip dibuka hanya oleh pasien pemilik dan CS yang ditugaskan.</text>
<text x="58" y="698" font-size="10" fill="#61716A" font-weight="400" text-anchor="start">CS tidak otomatis memperoleh akses rekam medis. Riwayat dan audit dipertahankan; permintaan chat memakai kunci pencegah duplikasi.</text>
<text x="58" y="746.5" font-size="10.5" fill="#61716A" font-weight="400" text-anchor="start">Batas demo: belum terhubung ke model AI eksternal, WhatsApp, SMS, atau email. Pertanyaan klinis diarahkan kepada dokter.</text>
